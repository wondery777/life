<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Archive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF3EC;--card:#FFFBF7;--ink:#4A3F44;--sub:#8C7F86;--lav:#8D78C4;--lavl:#ECE5F8;--but:#F2C96B;--butl:#FCF1D3;--sage:#9DC3A6;--sagel:#E3F0E6;--line:#EBDFD3}
@media(prefers-color-scheme:dark){:root{--bg:#2A2328;--card:#352D33;--ink:#F1E8E4;--sub:#B5A8AE;--lav:#B8A6E6;--lavl:#463C5C;--but:#E8BE5F;--butl:#4D4330;--sage:#8DB898;--sagel:#33443A;--line:#4A4046}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55}
:root{padding-top:env(safe-area-inset-top,0px)}
.app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:'Gaegu','Gowun Dodum',sans-serif;margin:0}
h2{font-size:22px}h3{font-size:18px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:8px 0 14px;min-height:0}
.hero-main{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.hero h1{font-size:31px;color:var(--lav);margin-top:2px;line-height:1.05}
.hero p{margin:2px 0 0;color:var(--sub);font-size:13px}.bear-mascot{width:104px;height:92px;object-fit:cover;object-position:center 42%;border-radius:18px;flex:none;mix-blend-mode:multiply}@media(prefers-color-scheme:dark){.bear-mascot{mix-blend-mode:normal}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:16px}.stat span{font-size:12px;color:var(--sub)}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px}
textarea{resize:vertical;min-height:110px}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;padding:8px 14px;background:var(--lavl)}
button.pri{background:var(--lav);color:#fff}
button.ghost{background:none;color:var(--sub);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center}.row>*{margin-bottom:0}
.sp{justify-content:space-between}
.moods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.moods button{font-size:13px;padding:5px 10px;background:var(--bg);border:1px solid var(--line)}
.moods button.on{background:var(--butl);border-color:var(--but)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
.date{font-size:12px;color:var(--sub)}
.todo{display:flex;align-items:center;gap:8px;padding:6px 0}
.todo .t{flex:1;cursor:pointer}.todo.done .t{text-decoration:line-through;color:var(--sub)}
.memo{background:var(--butl);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:none;padding:5px}.seg button.on{background:var(--but);color:#4A3F44}
.big{font-size:28px;font-family:'Gaegu',sans-serif;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--sub)}
.bar i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--line);min-height:3px}
.bar.now i{background:var(--but)}
.up{color:#C2564B}.down{color:#4E8F63}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--sub)}
.cal button{min-height:52px;background:var(--bg);border:1px solid var(--line);padding:2px;display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.2}
.cal button.sel{background:var(--lavl);border-color:var(--lav)}
.cal button.td{border-color:var(--but);border-width:2px}
.cal small{font-size:10px;color:var(--sub)}
nav{position:fixed;z-index:10;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:560px;margin:0 auto;display:flex;padding:6px 8px}
nav button{flex:1;background:none;font-size:12px;color:var(--sub);padding:6px 0;border-radius:14px}
nav button span{display:block;font-size:20px}
nav button.on{background:var(--lavl);color:var(--ink)}
.empty{color:var(--sub);text-align:center;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:13px;margin-bottom:8px}.bell-wrap{position:relative}.bell-btn{position:relative;font-size:18px;padding:6px 10px;background:var(--lavl)}.bell-btn.off{opacity:.55}.bell-dot{position:absolute;right:5px;top:4px;width:7px;height:7px;border-radius:50%;background:#D87568}.task-group{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.task-label{font-size:13px;color:var(--sub);margin-bottom:4px}.due{font-size:11px;color:#C2564B;white-space:nowrap}.bell-panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.bell-panel button{font-size:12px}
.row>button{white-space:nowrap;flex:none}
.day b{font-size:16px}.day p{line-height:1.6}
</style>
</head>

 return{a,b,l}}

 const list=items.map(o=>{const m=o.d.slice(0,7),h=m!==last?`<h3 style="margin:16px 0 6px">${m.replace('-','년 ')}월</h3>`:'';last=m;
  return h+`<div class="card day"><div class="row sp"><b>${+o.d.slice(8)}일 (${WD[new Date(o.d+'T00:00:00').getDay()]})</b><span><button class="ghost" data-a="goD" data-v="${o.d}">캘린더</button><button class="ghost" data-a="rec" data-v="${o.d}">기록하기</button></span></div>
  ${o.j?`<div>${ml(o.j.mood)} <b>${esc(o.j.head)}</b></div>${o.j.body?`<p style="white-space:pre-wrap;margin:6px 0">${esc(o.j.body)}</p>`:''}`:''}
  ${o.td.length?`<div class="date" style="margin-top:6px">한 일</div>${o.td.map(x=>`<div>${x.done?'✅':'⬜'} ${esc(x.text)} ${x.react?`<span class="date">${REACT[x.react]} ${RLAB[x.react]}</span>`:''}</div>`).join('')}`:''}
  ${o.ev.map(x=>`<div>📌 ${esc(x.text)}</div>`).join('')}
  ${o.ex.length?`<div class="date" style="margin-top:6px">지출 ${won(tot(o.ex))}</div>${o.ex.map(x=>`<div>${esc(x.title)} · ${x.cat} · ${won(x.amt)}</div>`).join('')}`:''}</div>`}).join('');
 return`<div class="card"><h2>모아보기</h2><div class="date">일기, 한 일, 일정, 지출을 날짜별로 한 번에 봐요</div>
 <div class="row" style="margin-top:8px"><input id="q" value="${esc(ui.q||'')}" placeholder="단어로 기억 찾기 (예: 카페)"><button class="pri" data-a="srch">찾기</button></div></div>
 ${list||'<div class="empty">'+(q?'찾는 기록이 없어요':'아직 기록이 없어요')+'</div>'}`}

function render(){const y=window.scrollY;$('#app').innerHTML={home,all,ledger,cal,trip}[ui.tab]();
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button data-a="tab" data-v="${k}" class="${ui.tab===k?'on':''}"><span>${i}</span>${l}</button>`).join('');window.scrollTo(0,y)}

const v=id=>($(id)?$(id).value.trim():'');
const H={
 bell:()=>{ui.bellOpen=!ui.bellOpen},alarm:()=>{S.settings=S.settings||{};if(!S.settings.alarm){if(!('Notification' in window))return alert('이 브라우저는 알림을 지원하지 않아요.');if(Notification.permission==='denied')return alert('브라우저 설정에서 알림 권한을 허용해 주세요.');if(Notification.permission==='default'){Notification.requestPermission().then(p=>{if(p==='granted'){S.settings.alarm=true;save();render()}else alert('알림 권한이 허용되지 않았어요.')});return 1}}S.settings.alarm=!S.settings.alarm;save()},
 tab:x=>{ui.tab=x;ui.note='';ui.od=null;ui.ee=null;ui.et=null;window.scrollTo(0,0)},
 dy:x=>{const d=new Date(ui.day+'T00:00:00');d.setDate(d.getDate()+ +x);if(ds(d)>today())return 1;ui.day=ds(d)},goT:()=>{ui.day=today()},
 rec:x=>{ui.day=x>today()?today():x;ui.tab='home';window.scrollTo(0,0)},mood:x=>{ui.mood=x;const e=S.diary[ui.day];if(e){e.mood=x;save()}},
 saveD:()=>{const h=v('#head');if(!h)return alert('오늘의 한 줄을 입력해 주세요');const t=ui.day,o=S.diary[t]||{};S.diary[t]={head:h,body:o.body||'',mood:o.mood||ui.mood};save()},
 dd:d=>{if(confirm('이 조각을 지울까요?')){delete S.diary[d];save()}},
 addT:()=>{const t=v('#todo');if(!t)return;S.todos.push({id:uid(),date:ui.day,text:t,due:v('#todoDue')||'',done:false,react:0});save()},
 tg:i=>{const x=S.todos.find(a=>a.id===i);x.done=!x.done;save()},rx:i=>{const x=S.todos.find(a=>a.id===i);x.react=((x.react||0)+1)%REACT.length;save()},
 dt:i=>{S.todos=S.todos.filter(a=>a.id!==i);save()},
 per:x=>{ui.per=x},
 addE:()=>{const a=parseInt(v('#amt'),10);if(!a||a<=0)return alert('금액을 입력해 주세요');const ed=v('#ed')||today(),r=rng(ui.per,0);S.exp.push({id:uid(),date:ed,cat:v('#cat'),amt:a,title:v('#et')||'소소한 지출'});ui.ed=ed;ui.note=(ed<r.a||ed>r.b)?`${ed} 내역을 저장했어요. 지금 보는 기간 밖이라 아래 목록엔 안 보여요. 모아보기에서 확인해요`:'저장했어요';save()},
 de:i=>{S.exp=S.exp.filter(a=>a.id!==i);save()},
 sel:x=>{ui.sel=x},mv:x=>{const d=new Date(ui.cy,ui.cm+ +x,1);ui.cy=d.getFullYear();ui.cm=d.getMonth()},
 addV:()=>{const t=v('#ev');if(!t)return;S.events.push({id:uid(),date:ui.sel,text:t});save()},dv:i=>{S.events=S.events.filter(a=>a.id!==i);save()},
 tp:x=>{ui.trip=x;ui.op=null;ui.et=null},
 srch:()=>{ui.q=v('#q')},
 ty:x=>{ui.ty=x;ui.tm='all';ui.op=null;ui.et=null},tm:x=>{ui.tm=x;ui.op=null;ui.et=null},
 eT:x=>{ui.et=x},eTx:()=>{ui.et=null},
 xe:x=>{ui.ee=x},xx:()=>{ui.ee=null},
 xs:i=>{const e=S.exp.find(a=>a.id===i),a=parseInt(v('#xa'),10),d=v('#xd');if(!a||a<=0)return alert('금액을 입력해 주세요');if(!d)return alert('날짜를 골라 주세요');e.amt=a;e.cat=v('#xk');e.date=d;e.title=v('#xt')||'소소한 지출';ui.ee=null;save()},
 editTodo:i=>{ui.todoEdit=i},saveTodo:i=>{const x=S.todos.find(a=>a.id===i),n=v('#todoEdit');if(!n)return alert('할 일을 입력해 주세요');x.text=n;x.due=v('#todoDueEdit')||'';ui.todoEdit=null;save()},cancelTodo:()=>{ui.todoEdit=null},
 ve:i=>{const x=S.events.find(a=>a.id===i),n=prompt('일정 수정',x.text);if(n===null)return 1;if(n.trim()){x.text=n.trim();save()}},
 eTs:()=>{const t=cur(),n=v('#etit');if(!n)return alert('여행 이름을 입력해 주세요');const a=gd('es'),b=gd('ee');if(!a||!b)return alert('없는 날짜예요. 날짜를 다시 골라 주세요');if(b<a)return alert('도착일이 출발일보다 빠를 수 없어요');t.title=n;t.place=v('#epl');t.start=a;t.end=b;delete t.period;ui.et=null;if(ui.ty!=='all'){ui.ty=a.slice(0,4);ui.tm='all'}save()},
 addT2:()=>{const t=v('#tt');if(!t)return alert('여행 이름을 입력해 주세요');const a=gd('s'),b=gd('e');if(!a||!b)return alert('없는 날짜예요. 날짜를 다시 골라 주세요');if(b<a)return alert('도착일이 출발일보다 빠를 수 없어요');if(ui.ty!=='all'){ui.ty=a.slice(0,4);ui.tm='all'}const n={id:uid(),title:t,start:a,end:b,place:v('#tpl'),spots:[]};S.trips.push(n);ui.trip=n.id;save()},
 dT:i=>{if(confirm('이 여행을 지울까요?')){S.trips=S.trips.filter(a=>a.id!==i);ui.trip=null;save()}},
 addS:()=>{const n=v('#sn');if(!n)return;S.trips.find(a=>a.id===ui.trip).spots.push({name:n,review:v('#sr'),subs:[],date:v('#sd')});ui.sd=v('#sd');save()},
 addU:i=>{const t=v('#su'+i);if(!t)return;const sp=S.trips.find(a=>a.id===ui.trip).spots[+i];(sp.subs=sp.subs||[]).push(t);ui.op=+i;save()},
 dU:x=>{const[i,k]=x.split(':').map(Number);S.trips.find(a=>a.id===ui.trip).spots[i].subs.splice(k,1);ui.op=i;save()},
 dS:i=>{S.trips.find(a=>a.id===ui.trip).spots.splice(+i,1);ui.op=null;ui.pick=null;ui.res=null;save()},
 exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`life-archive-${today()}.json`;a.click();return 1},
 imp:()=>{$('#imp').click();return 1}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!H[b.dataset.a])return;if(b.type==='checkbox'&&e.target!==b)return;if(!H[b.dataset.a](b.dataset.v))render()});
document.addEventListener('change',e=>{const d=e.target.dataset&&e.target.dataset.d;if(d&&S.diary[d]){S.diary[d].body=e.target.value;save()}if(e.target.id==='dp'){ui.day=e.target.value&&e.target.value<=today()?e.target.value:today();render();return}const w_=e.target.dataset||{};if(w_.dh!==undefined||w_.dm!==undefined){const k=w_.dh!==undefined?w_.dh:w_.dm,en=S.diary[k];if(en){if(w_.dh!==undefined){const nv=e.target.value.trim();if(nv)en.head=nv}else en.mood=e.target.value;ui.od=k;save();render()}return}const q_=e.target.dataset||{};if(q_.sn!==undefined||q_.sr!==undefined){const k=+(q_.sn!==undefined?q_.sn:q_.sr),q=cur().spots[k];if(q_.sn!==undefined){const nv=e.target.value.trim();if(nv)q.name=nv}else q.review=e.target.value.trim();ui.op=k;save();render();return}const sp=e.target.dataset&&e.target.dataset.sp;if(sp!==undefined){const t=S.trips.find(a=>a.id===ui.trip);t.spots[+sp].date=e.target.value;ui.op=+sp;save();render()}});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!=='object'||!o.diary)throw 0;if(!confirm('지금 기록을 가져온 파일로 바꿀까요?'))return;S=Object.assign({diary:{},todos:[],exp:[],events:[],trips:[]},o);save();render()}catch(x){alert('올바른 백업 파일이 아니에요')}};r.readAsText(f);e.target.value=''});
render();
const notified=new Set();function checkReminders(){if(!S.settings?.alarm||!('Notification' in window)||Notification.permission!=='granted')return;const d=today();S.todos.filter(x=>!x.done&&x.due===d).forEach(x=>{const k='todo:'+x.id+':'+d;if(!notified.has(k)){new Notification('Life Archive · 오늘 마감',{body:x.text});notified.add(k)}});S.events.filter(x=>x.date===d).forEach(x=>{const k='event:'+x.id+':'+d;if(!notified.has(k)){new Notification('Life Archive · 오늘 일정',{body:x.text});notified.add(k)}})}
checkReminders();setInterval(checkReminders,60000);
</script>
</body>
</html>
